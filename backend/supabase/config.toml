# Only what the edge functions need. A plain HTML form cannot send a login
# token, so JWT verification is off for the public form function; it defends
# itself (honeypot + size cap + whitelist, see _shared/validate.ts).
project_id = "amarti"

[functions.request]
verify_jwt = false

[functions.signup]
verify_jwt = false

# Sign-in for the private app: magic link only, for addresses already in Auth
# (the owner, added by hand) — nobody can create an account. The link returns
# to the dashboard (the app package) on GitHub Pages; localhost:4322 is `pnpm dev:app` (also used by the
# local stack, `pnpm backend:local`).
[auth]
site_url = "https://fora00.github.io/amarti/dashboard/"
additional_redirect_urls = ["https://fora00.github.io/amarti/dashboard/", "http://localhost:4322/", "http://127.0.0.1:4322/"]
enable_signup = false
