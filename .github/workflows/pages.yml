# Builds the public site and the private app (under <site>/dashboard/) and publishes
# both on GitHub Pages (Settings → Pages →
# Source: GitHub Actions). Runs on every push to main, or by hand.
#
# It is still a PREVIEW build (PUBLIC_DEMO=1): noindex on every page, robots
# `Disallow: /`, no sitemap — `siteUrl` and prices are placeholders. Drop the
# flag once the real domain and prices are in.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refuses a hand-edited vendor/ (it must come from `pnpm sync amarti`).
      - run: pnpm vendor:check

      - id: pages
        uses: actions/configure-pages@v5

      # base_path is "/<repo>" on github.io, "" on a custom domain.
      - name: Build site
        run: pnpm --filter amarti build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_DEMO: "1"
          # The sign-up form on event pages POSTs to <this>/functions/v1/signup.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}

      # The private app (behind the magic-link login, noindex). Its Supabase URL and
      # anon key are public by nature, so they are repository VARIABLES, not secrets:
      # Settings → Secrets and variables → Actions → Variables →
      # PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY. Unset = the app still builds
      # and says it is not configured. env-guard.mjs refuses a service-role key.
      - name: Build app
        run: pnpm --filter amarti-app build
        env:
          APP_BASE: ${{ steps.pages.outputs.base_path }}/dashboard/
          APP_SITE: ${{ steps.pages.outputs.origin }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}

      # The generic contact form is not linked anywhere yet: keep it off the
      # preview. The course sign-up (eventi/*, iscrizione/, privacy/) stays.
      - name: Drop the unlinked contact form
        working-directory: site/dist
        run: rm -rf contatti grazie en/contatti en/grazie

      - name: Put the app under the site
        run: |
          rm -rf site/dist/dashboard
          cp -R app/dist site/dist/dashboard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
